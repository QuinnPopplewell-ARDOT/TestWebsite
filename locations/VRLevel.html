<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <title>VisTech Map</title>

    <style>
        .button {
            pointer-events: auto;
            z-index: 10;
        }

        #backButton{
            position: absolute; 
            z-index: 10; 
            top: 10px; 
            right: 10px;
            max-width: 20%;
            max-height: 15%;
        }
        
    </style>

</head>
<body>
    <a id="returnLink" href="../index.html">
        <svg id="backButton" width="128px" height="128px" viewBox="0 0 24.00 24.00" fill="none" xmlns="http://www.w3.org/2000/svg" transform="rotate(0)matrix(1, 0, 0, 1, 0, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC" stroke-width="0.144"></g><g id="SVGRepo_iconCarrier"> <path d="M9 22H15C20 22 22 20 22 15V9C22 4 20 2 15 2H9C4 2 2 4 2 9V15C2 20 4 22 9 22Z" stroke="#292D32" stroke-width="1.416" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M9.00002 15.3802H13.92C15.62 15.3802 17 14.0002 17 12.3002C17 10.6002 15.62 9.22021 13.92 9.22021H7.15002" stroke="#292D32" stroke-width="1.416" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"></path> <path d="M8.57 10.7701L7 9.19012L8.57 7.62012" stroke="#292D32" stroke-width="1.416" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
    </a>
    <a-scene>
        <a-assets>
            <img id="place" src="">

            <script>
                const urlParams = new URLSearchParams(window.location.search);
                let value = urlParams.get('place');
                let plot = urlParams.get('plot');

                document.getElementById("returnLink").href= `../${plot}.html`;

                let imageString = `${value}.png`;
                document.getElementById("place").src = imageString;
            </script>

        </a-assets>
        <a-sky id="image-360" radius="10" src="#place"></a-sky>
        <a-camera>
    
        </a-camera>
    </a-scene>
</body>
</html>
