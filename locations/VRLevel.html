<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <title>VisTech Map</title>

    <style>
        .button {
            pointer-events: auto;
            z-index: 10;
        }

        #backButton{
            position: absolute; 
            z-index: 10; 
            top: 10px; 
            right: 10px;
            max-width: 20%;
            max-height: 15%;
        }
        
    </style>

</head>
<body>
    <a id="returnLink" href="../index.html">
        <image id="backButton" src="BackText.png"></image>
    </a>
    <a-scene>
        <a-assets>
            <img id="place" src="">

            <script>
                const urlParams = new URLSearchParams(window.location.search);
                let value = urlParams.get('place');
                let plot = urlParams.get('plot');

                document.getElementById("returnLink").href= `../${plot}.html`;

                let imageString = `${value}.png`;
                document.getElementById("place").src = imageString;
            </script>

        </a-assets>
        <a-sky id="image-360" radius="10" src="#place"></a-sky>
        <a-camera>
    
        </a-camera>
    </a-scene>
</body>
</html>
